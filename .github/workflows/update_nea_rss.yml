name: Update NEA RSS

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4 feedgen
          python -m playwright install --with-deps chromium

      - name: Generate RSS
        run: |
          python scripts/make_nea_nyyw.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/nea_nyyw.xml
          git commit -m "Update NEA RSS" || echo "No changes to commit"
          git push
